name: KhabarF24 Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: khabarf24-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: KhabarF24-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify media tools
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import aiohttp; print('aiohttp OK')"

      # حافظه‌ی خبرهای منتشرشده بین اجراها (برای جلوگیری از انتشار
      # دوباره‌ی خبرهای قبلی بعد از هر ری‌استارت)
      - name: Restore seen-news state
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: |
          mkdir -p data/state
          python main.py

      # حتی اگر اجرا لغو یا خطادار شد، حافظه ذخیره شود
      - name: Save seen-news state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: seen-${{ github.run_id }}
